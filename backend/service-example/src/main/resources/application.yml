server:
  port: 8081

spring:
  application:
    name: service-example
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/lyf?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload:
    path: uploads

logging:
  level:
    com.example: DEBUG
    org.hibernate.SQL: DEBUG
